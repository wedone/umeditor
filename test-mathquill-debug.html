<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathQuill 加载测试</title>
    <link rel="stylesheet" href="./third-party/mathquill/mathquill.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background: #f5f5f5;
        }
        .status {
            padding: 20px;
            margin: 10px 0;
            border-radius: 8px;
            font-size: 16px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        pre {
            background: #fff;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover {
            background: #0056b3;
        }
        #render-area {
            background: white;
            padding: 30px;
            margin: 20px 0;
            border-radius: 8px;
            min-height: 100px;
            border: 2px solid #dee2e6;
        }
    </style>
</head>
<body>
    <h1>🔍 MathQuill 加载诊断</h1>
    
    <div id="status-jquery" class="status info">检查 jQuery...</div>
    <div id="status-mathquill" class="status info">检查 MathQuill...</div>
    <div id="status-interface" class="status info">检查 MathQuill 接口...</div>
    
    <h2>调试信息</h2>
    <pre id="debug-info">加载中...</pre>
    
    <h2>渲染测试</h2>
    <button onclick="testSimpleRender()">测试简单渲染 (x^2)</button>
    <button onclick="testMathbbN()">测试 \mathbb{N}</button>
    <button onclick="testMathbbABC()">测试 \mathbb{ABC}</button>
    
    <div id="render-area"></div>

    <script src="./third-party/jquery.min.js"></script>
    <script src="./third-party/mathquill/mathquill.js"></script>
    <script>
        console.log('=== MathQuill 加载诊断开始 ===');
        
        var debugInfo = [];
        
        function log(msg) {
            console.log(msg);
            debugInfo.push(msg);
            updateDebugInfo();
        }
        
        function updateDebugInfo() {
            document.getElementById('debug-info').textContent = debugInfo.join('\n');
        }
        
        function setStatus(id, success, message) {
            var el = document.getElementById(id);
            el.className = 'status ' + (success ? 'success' : 'error');
            el.innerHTML = (success ? '✅ ' : '❌ ') + message;
        }
        
        // 检查 jQuery
        setTimeout(function() {
            if (typeof jQuery !== 'undefined' && typeof $ !== 'undefined') {
                setStatus('status-jquery', true, 'jQuery 已加载 (版本: ' + jQuery.fn.jquery + ')');
                log('✅ jQuery version: ' + jQuery.fn.jquery);
            } else {
                setStatus('status-jquery', false, 'jQuery 未加载');
                log('❌ jQuery not found');
            }
        }, 100);
        
        // 检查 MathQuill
        setTimeout(function() {
            if (typeof MathQuill !== 'undefined') {
                setStatus('status-mathquill', true, 'MathQuill 已加载');
                log('✅ MathQuill found: ' + typeof MathQuill);
                log('MathQuill keys: ' + Object.keys(MathQuill).join(', '));
                
                // 检查接口
                try {
                    var MQ = MathQuill.getInterface(2);
                    if (MQ && typeof MQ.StaticMath === 'function') {
                        setStatus('status-interface', true, 'MathQuill 接口正常 (v2)');
                        log('✅ MathQuill.getInterface(2) successful');
                        log('MQ.StaticMath: ' + typeof MQ.StaticMath);
                        log('MQ.MathField: ' + typeof MQ.MathField);
                    } else {
                        setStatus('status-interface', false, 'MathQuill 接口不完整');
                        log('❌ MQ interface incomplete');
                    }
                } catch (e) {
                    setStatus('status-interface', false, 'MathQuill 接口错误: ' + e.message);
                    log('❌ Error getting interface: ' + e.message);
                }
            } else if (typeof $ !== 'undefined' && typeof $.fn.mathquill === 'function') {
                // 老版本 MathQuill（仅 jQuery 插件）
                setStatus('status-mathquill', true, 'MathQuill 已加载（jQuery 插件版本）');
                log('✅ MathQuill found as jQuery plugin');
                log('$.fn.mathquill: ' + typeof $.fn.mathquill);
                
                setStatus('status-interface', true, 'MathQuill jQuery 插件接口正常');
                log('✅ jQuery plugin interface available');
                log('注意：此版本使用 jQuery 插件接口，非现代 MathQuill API');
            } else {
                setStatus('status-mathquill', false, 'MathQuill 未加载');
                log('❌ MathQuill not found');
                setStatus('status-interface', false, '无法检查接口（MathQuill 未加载）');
            }
        }, 500);
        
        function testSimpleRender() {
            log('\n--- 测试简单渲染 ---');
            try {
                // 检查 MathQuill 是否为现代 API
                if (typeof MathQuill !== 'undefined' && typeof MathQuill.getInterface === 'function') {
                    var MQ = MathQuill.getInterface(2);
                    var span = document.createElement('span');
                    document.getElementById('render-area').appendChild(span);
                    
                    var staticMath = MQ.StaticMath(span);
                    staticMath.latex('x^2');
                    
                    log('✅ 渲染成功: x^2 (使用现代 API)');
                    log('DOM 内容: ' + span.innerHTML.substring(0, 100) + '...');
                } else if (typeof $ !== 'undefined' && typeof $.fn.mathquill === 'function') {
                    // 使用 jQuery 插件接口
                    var $span = $('<span></span>');
                    $('#render-area').append($span);
                    $span.mathquill();
                    $span.mathquill('latex', 'x^2');
                    
                    log('✅ 渲染成功: x^2 (使用 jQuery 插件接口)');
                    log('DOM 内容: ' + $span.html().substring(0, 100) + '...');
                } else {
                    throw new Error('MathQuill 未找到或不可用');
                }
                
            } catch (e) {
                log('❌ 渲染失败: ' + e.message);
                document.getElementById('render-area').innerHTML += 
                    '<div style="color: red;">错误: ' + e.message + '</div>';
            }
        }
        
        function testMathbbN() {
            log('\n--- 测试 \\mathbb{N} ---');
            try {
                if (typeof $ !== 'undefined' && typeof $.fn.mathquill === 'function') {
                    // 测试原始 LaTeX
                    var $span1 = $('<span></span>');
                    $('#render-area').append($span1);
                    $span1.mathquill();
                    $span1.mathquill('latex', '\\mathbb{N}');
                    
                    log('尝试: \\mathbb{N}');
                    log('DOM 内容: ' + $span1.html());
                    
                    if ($span1.html().trim().length > 50) {
                        log('✅ 渲染成功（长度: ' + $span1.html().length + '）');
                    } else {
                        log('⚠️  渲染结果较短，尝试归一化版本');
                        
                        // 尝试归一化版本
                        var $span2 = $('<span></span>');
                        $('#render-area').append($span2);
                        $span2.mathquill();
                        $span2.mathquill('latex', '\\N');
                        
                        log('尝试: \\N (归一化)');
                        log('DOM 内容: ' + $span2.html());
                        
                        if ($span2.html().trim().length > 50) {
                            log('✅ 归一化版本渲染成功');
                        }
                    }
                } else {
                    throw new Error('jQuery 插件接口不可用');
                }
                
            } catch (e) {
                log('❌ 渲染失败: ' + e.message);
            }
        }
        
        function testMathbbABC() {
            log('\n--- 测试 \\mathbb{ABC} (预期失败) ---');
            try {
                if (typeof $ !== 'undefined' && typeof $.fn.mathquill === 'function') {
                    var $span = $('<span></span>');
                    $('#render-area').append($span);
                    $span.mathquill();
                    $span.mathquill('latex', '\\mathbb{ABC}');
                    
                    log('尝试: \\mathbb{ABC}');
                    log('DOM 内容: ' + $span.html());
                    log('DOM 长度: ' + $span.html().length);
                    
                    if ($span.html().trim().length < 50) {
                        log('✅ 符合预期：渲染失败（不支持）');
                    } else {
                        log('⚠️  意外：渲染成功');
                    }
                } else {
                    throw new Error('jQuery 插件接口不可用');
                }
                
            } catch (e) {
                log('✅ 符合预期：抛出错误 - ' + e.message);
            }
        }
        
        log('诊断脚本已加载');
    </script>
</body>
</html>
